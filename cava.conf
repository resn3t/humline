[general]
framerate = 24
bars = 10
autosens = 1
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
channels = mono
mono_option = average
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
